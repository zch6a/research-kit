name: CI
# The generated files are what tools.json says, and every tool's skill, as the marketplace installs it (its repository's
# v0 tag), parses. Weekly too: a tool's new release could break its skill without a change here (GitHub stops a
# scheduled workflow after 60 days without activity in the repository; a push starts it again).
on:
  push:
  pull_request:
  schedule: [{ cron: "17 6 * * 1" }]   # Mondays, 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to commits; the token is not left in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3; it has no moving major tag
      - name: Lint and format (ruff)
        run: |
          uvx ruff@0.15.0 check scripts tests
          uvx ruff@0.15.0 format --check scripts tests
      - name: Tests of the two scripts (offline)
        run: uv run --no-project --python 3.12 --with pytest==9.0.2 --with pyyaml==6.0.3 python -m pytest -q tests
      - name: The marketplace, the READMEs' tool sections and the site are up to date
        run: uv run --no-project python scripts/render.py --check
      - name: Every tool's skill at v0 parses, with its name and a description
        env:
          GITHUB_TOKEN: ${{ github.token }}   # read-only (contents: read); GitHub's API limit without it is 60 an hour
        run: uv run --no-project --with pyyaml==6.0.3 python scripts/check_skills.py
